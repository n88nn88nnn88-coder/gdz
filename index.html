
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Решебник</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #ffffff;
            padding: 16px;
            margin: 0;
        }
        h1 { text-align: center; }
        .card {
            background: #f1f1f1;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
        }
        button {
            padding: 12px;
            margin: 4px;
            border: none;
            border-radius: 10px;
            background: #2ea6ff;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }
        button.selected { background: #0066cc; }
        input {
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #ccc;
            font-size: 16px;
            width: 100%;
            box-sizing: border-box;
        }
        #result {
            background: #f1f1f1;
            border-radius: 12px;
            padding: 16px;
            display: none;
            margin-top: 16px;
        }
        a { color: #2ea6ff; font-weight: bold; }
    </style>
</head>
<body>
    <h1>📚 Решебник</h1>

    <div class="card">
        <h2>Класс</h2>
        <div id="classButtons">
            <button data-value="5">5</button>
            <button data-value="6">6</button>
            <button data-value="7">7</button>
            <button data-value="8">8</button>
            <button data-value="9">9</button>
            <button data-value="10">10</button>
            <button data-value="11">11</button>
        </div>
    </div>

    <div class="card">
        <h2>Предмет</h2>
        <div id="subjectButtons">
            <button data-value="algebra">Алгебра</button>
            <button data-value="russian">Русский</button>
        </div>
    </div>

    <div class="card">
        <h2>Номер задания</h2>
        <input type="number" id="taskNumber" placeholder="Например: 15" min="1">
    </div>

    <div id="result"></div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        let selectedClass = null;
        let selectedSubject = null;

        document.querySelectorAll('#classButtons button').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('#classButtons button').forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');
                selectedClass = btn.dataset.value;
            });
        });

        document.querySelectorAll('#subjectButtons button').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('#subjectButtons button').forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');
                selectedSubject = btn.dataset.value;
            });
        });

        document.getElementById('taskNumber').addEventListener('input', (e) => {
            const number = e.target.value.trim();
            if (!number || !selectedClass || !selectedSubject) return;

            let url = '';
            if (selectedSubject === 'algebra') {
                url = `https://resheba.top/GDZ/${selectedClass}-algebra-2020/glava1/${number}.png`;
            } else {
                url = `https://resheba.top/GDZ/${selectedClass}-russian/${number}.png`;
            }

            const resultDiv = document.getElementById('result');
            resultDiv.style.display = 'block';
            resultDiv.innerHTML = `🔗 <a href="${url}" target="_blank">Открыть решение №${number}</a>`;
        });
    </script>
</body>
</html>
